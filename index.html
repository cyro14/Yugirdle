
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"></meta>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"></meta>
    <title>Yugirdle - O Desafio Diário</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Teko:wght@500&display=swap');

        :root {
            --bg-dark: #121212; --panel-bg: #1e1e1e;
            --green: #2ecc71; --red: #e74c3c; --gold: #f1c40f;
            --text-light: #ffffff; --border: #333;
        }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-light);
            font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; align-items: center;
        }

        /* HEADER & STREAK */
        header { width: 100%; max-width: 800px; padding: 15px; text-align: center; border-bottom: 1px solid var(--border); position: relative; box-sizing: border-box; }
        h1 { margin: 0; font-family: 'Teko', sans-serif; font-size: 36px; letter-spacing: 2px; color: var(--gold); }
        .streak-box { position: absolute; top: 20px; right: 20px; font-weight: bold; font-size: 18px; color: #ff9f43; display: flex; align-items: center; gap: 5px; }

        /* ÁREA DE INPUT */
        .input-area { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border-radius: 5px; border: 1px solid #555; background: #222; color: #fff; font-size: 16px; font-weight: bold; }
        button { padding: 12px 20px; background: var(--gold); color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #d4af37; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }

        /* GRID DO JOGO */
        .grid-container { width: 100%; max-width: 800px; padding: 10px; box-sizing: border-box; overflow-x: auto; }
        .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr; gap: 5px; min-width: 600px; margin-bottom: 10px; }
        .grid-header { font-size: 12px; color: #aaa; text-align: center; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .cell { background: var(--panel-bg); border: 2px solid var(--border); border-radius: 5px; padding: 10px 5px; text-align: center; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 14px; min-height: 40px; }
        
        .correct { background-color: var(--green); border-color: #27ae60; }
        .wrong { background-color: var(--red); border-color: #c0392b; }

        /* MODAL DE RESULTADO (FIM DE JOGO) */
        #result-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 100; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--panel-bg); padding: 30px; border-radius: 10px; border: 2px solid var(--gold); text-align: center; max-width: 400px; width: 100%; }
        .card-image { width: 100%; max-width: 250px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.8); margin: 15px 0; object-fit: contain; }
        #share-btn { background: #2980b9; color: #fff; width: 100%; margin-top: 15px; }
        
        ::-webkit-scrollbar { height: 8px; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>YUGIRDLE</h1>
        <div class="streak-box">🔥 <span id="streak-count">0</span></div>
    </header>

    <div class="input-area">
        <input autocomplete="off" id="guess-input" list="card-list" placeholder="Digite o nome da Carta..." type="text" />
        <datalist id="card-list"></datalist>
        <button id="guess-btn" onclick="fazerPalpite()">Tentar</button>
    </div>

    <p style="color: #aaaaaa; font-size: 14px; margin: 0; text-align: center;">Tentativas: <span id="attempt-count">0</span>/6</p>

    <div class="grid-container">
        <div class="grid grid-header">
            <div>CARTA</div><div>ATRIBUTO</div><div>TIPO</div><div>NÍVEL</div><div>ATK</div><div>DEF</div>
        </div>
        <div id="guesses-grid"></div>
    </div>

    <!-- MODAL DE FIM DE JOGO -->
    <div id="result-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top: 0;">FIM DE JOGO</h2>
            <p id="modal-desc">A carta de hoje era:</p>
            <img alt="Carta do Dia" class="card-image" id="modal-image" src="" />
            <p id="modal-card-name" style="color: var(--gold); font-size: 20px; font-weight: bold;"></p>
            <button id="share-btn" onclick="copiarResultado()">📋 Copiar Resultado para Whatsapp</button>
            <p style="color: #aaaaaa; font-size: 12px; margin-top: 15px;">A próxima carta será liberada à meia-noite!</p>
            <button onclick="document.getElementById('result-modal').style.display='none'" style="background: #444; color: white; font-size: 12px; margin-top: 10px; padding: 8px 15px;">Fechar</button>
        </div>
    </div>

    ];

    // Ordena alfabeticamente para o Datalist (será útil quando você der os nomes reais)
    DB_CARTAS.sort((a, b) => a.nome.localeCompare(b.nome));

    // Variáveis de Estado
    let cartaDoDia;
    let tentativas = [];
    const MAX_TENTATIVAS = 6;
    let jogoFinalizado = false;

    // --- 2. LÓGICA DE SEMENTE DIÁRIA E STREAK ---
    function initJogo() {
        preencherDatalist();
        
        const hoje = new Date();
        const dataStr = hoje.getFullYear() + "-" + (hoje.getMonth() + 1) + "-" + hoje.getDate();
        
        const hash = hoje.getFullYear() * 10000 + (hoje.getMonth() + 1) * 100 + hoje.getDate();
        const indiceDia = hash % DB_CARTAS.length;
        cartaDoDia = DB_CARTAS[indiceDia];

        carregarProgresso(dataStr);
    }

    function preencherDatalist() {
        const datalist = document.getElementById('card-list');
        DB_CARTAS.forEach(c => {
            let option = document.createElement('option');
            option.value = c.nome;
            datalist.appendChild(option);
        });
    }

    // --- 3. GERENCIAMENTO DE ESTADO (LOCAL STORAGE) ---
    function carregarProgresso(dataHojeStr) {
        let streak = parseInt(localStorage.getItem('yugirdle_streak')) || 0;
        let lastPlay = localStorage.getItem('yugirdle_last_play') || "";
        
        const ontem = new Date();
        ontem.setDate(ontem.getDate() - 1);
        const dataOntemStr = ontem.getFullYear() + "-" + (ontem.getMonth() + 1) + "-" + ontem.getDate();

        if(lastPlay !== dataHojeStr && lastPlay !== dataOntemStr && lastPlay !== "") {
            streak = 0; 
        }
        document.getElementById('streak-count').innerText = streak;

        const estadoSalvo = JSON.parse(localStorage.getItem('yugirdle_estado_' + dataHojeStr));
        if (estadoSalvo) {
            tentativas = estadoSalvo.tentativas;
            jogoFinalizado = estadoSalvo.jogoFinalizado;
            
            tentativas.forEach(t => renderizarLinha(t));
            document.getElementById('attempt-count').innerText = tentativas.length;

            if (jogoFinalizado) mostrarModal(estadoSalvo.venceu);
        }
    }

    function salvarProgresso(venceu) {
        const hoje = new Date();
        const dataStr = hoje.getFullYear() + "-" + (hoje.getMonth() + 1) + "-" + hoje.getDate();
        
        localStorage.setItem('yugirdle_estado_' + dataStr, JSON.stringify({
            tentativas: tentativas,
            jogoFinalizado: jogoFinalizado,
            venceu: venceu
        }));

        if (jogoFinalizado) {
            let lastPlay = localStorage.getItem('yugirdle_last_play');
            if (lastPlay !== dataStr) {
                let streak = parseInt(localStorage.getItem('yugirdle_streak')) || 0;
                streak++;
                localStorage.setItem('yugirdle_streak', streak);
                localStorage.setItem('yugirdle_last_play', dataStr);
                document.getElementById('streak-count').innerText = streak;
            }
        }
    }

    // --- 4. MOTOR DO JOGO ---
    function fazerPalpite() {
        if (jogoFinalizado) return;

        const input = document.getElementById('guess-input');
        const nomePalpite = input.value.trim();
        const cartaEscolhida = DB_CARTAS.find(c => c.nome.toLowerCase() === nomePalpite.toLowerCase());

        if (!cartaEscolhida) {
            alert("Carta não encontrada! Escolha uma das opções da lista sugerida.");
            return;
        }

        if (tentativas.length >= MAX_TENTATIVAS) return;

        input.value = ""; 
        tentativas.push(cartaEscolhida);
        renderizarLinha(cartaEscolhida);
        document.getElementById('attempt-count').innerText = tentativas.length;

        verificarFimDeJogo(cartaEscolhida);
    }

    function renderizarLinha(palpite) {
        const grid = document.getElementById('guesses-grid');
        const linha = document.createElement('div');
        linha.className = 'grid';

        linha.appendChild(criarCelula(palpite.nome, palpite.nome === cartaDoDia.nome));
        linha.appendChild(criarCelula(palpite.atributo, palpite.atributo === cartaDoDia.atributo));
        linha.appendChild(criarCelula(palpite.tipo, palpite.tipo === cartaDoDia.tipo));
        linha.appendChild(criarCelulaNumero(palpite.nivel, cartaDoDia.nivel));
        linha.appendChild(criarCelulaNumero(palpite.atk, cartaDoDia.atk));
        linha.appendChild(criarCelulaNumero(palpite.def, cartaDoDia.def));

        grid.appendChild(linha);
    }

    function criarCelula(texto, estaCorreto) {
        const div = document.createElement('div');
        div.className = `cell ${estaCorreto ? 'correct' : 'wrong'}`;
        div.innerText = texto;
        return div;
    }

    function criarCelulaNumero(valorPalpite, valorAlvo) {
        const div = document.createElement('div');
        if (valorPalpite === valorAlvo) {
            div.className = 'cell correct';
            div.innerText = valorPalpite;
        } else {
            div.className = 'cell wrong';
            const seta = valorPalpite < valorAlvo ? " ⬆️" : " ⬇️";
            // A mudança foi feita na linha abaixo (innerHTML)
            div.innerHTML = valorPalpite + seta;
        }
        return div;
    }

    function verificarFimDeJogo(palpite) {
        let venceu = false;
        
        if (palpite.nome === cartaDoDia.nome) {
            jogoFinalizado = true;
            venceu = true;
        } else if (tentativas.length >= MAX_TENTATIVAS) {
            jogoFinalizado = true;
            venceu = false;
        }

        if (jogoFinalizado) {
            document.getElementById('guess-input').disabled = true;
            document.getElementById('guess-btn').disabled = true;
            salvarProgresso(venceu);
            setTimeout(() => mostrarModal(venceu), 1000);
        } else {
            salvarProgresso(false); 
        }
    }

    // --- 5. TELA FINAL E COMPARTILHAMENTO ---
    function mostrarModal(venceu) {
        const modal = document.getElementById('result-modal');
        const title = document.getElementById('modal-title');
        
        title.innerText = venceu ? "VITÓRIA!" : "FIM DE JOGO!";
        title.style.color = venceu ? "var(--green)" : "var(--red)";
        
        // Agora o script puxa a URL diretamente do seu banco Local do Blogger
        document.getElementById('modal-image').src = cartaDoDia.url;
        document.getElementById('modal-card-name').innerText = cartaDoDia.nome;
        
        modal.style.display = 'flex';
    }

    function copiarResultado() {
        const streak = document.getElementById('streak-count').innerText;
        
        // Códigos Unicode para blindar os emojis contra o editor do Blogger
        const fogo = '\uD83D\uDD25';
        const verde = '\uD83D\uDFE9';
        const vermelho = '\uD83D\uDFE5';
        const cima = '\u2B06\uFE0F';
        const baixo = '\u2B07\uFE0F';

        let resultadoTxt = `Yugirdle Diário ${fogo} ${streak}\nTentativas: ${tentativas.length}/${MAX_TENTATIVAS}\n\n`;

        tentativas.forEach(t => {
            let linhaTxt = "";
            linhaTxt += (t.nome === cartaDoDia.nome) ? `${verde} ` : `${vermelho} `;
            linhaTxt += (t.atributo === cartaDoDia.atributo) ? `${verde} ` : `${vermelho} `;
            linhaTxt += (t.tipo === cartaDoDia.tipo) ? `${verde} ` : `${vermelho} `;
            
            linhaTxt += (t.nivel === cartaDoDia.nivel) ? `${verde} ` : (t.nivel < cartaDoDia.nivel ? `${cima} ` : `${baixo} `);
            linhaTxt += (t.atk === cartaDoDia.atk) ? `${verde} ` : (t.atk < cartaDoDia.atk ? `${cima} ` : `${baixo} `);
            linhaTxt += (t.def === cartaDoDia.def) ? `${verde} ` : (t.def < cartaDoDia.def ? `${cima} ` : `${baixo} `);
            
            resultadoTxt += linhaTxt.trim() + "\n";
        });

        resultadoTxt += "\nJogue em: https://superygo.blogspot.com/p/yugirdle.html";

        navigator.clipboard.writeText(resultadoTxt).then(() => {
            const btn = document.getElementById('share-btn');
            btn.innerText = "Copiado! Cole no seu WhatsApp";
            btn.style.background = "#27ae60";
        });
    }

    window.onload = initJogo;

</script>
</body>
</html>
